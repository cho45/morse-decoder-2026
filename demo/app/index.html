<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CW Decoder PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.all.min.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <!-- Setup Screen -->
        <div v-if="state.view === 'setup'" class="screen setup-screen">
            <h1>CW Decoder</h1>

            <div class="card">
                <h2>受信設定</h2>

                <div class="control-group">
                    <label>ターゲット周波数 (Hz)</label>
                    <div class="freq-input">
                        <button @click="adjustFreq(-50)">-50</button>
                        <button @click="adjustFreq(-10)">-10</button>
                        <input type="number" v-model.number="settings.targetFreq" step="10">
                        <button @click="adjustFreq(10)">+10</button>
                        <button @click="adjustFreq(50)">+50</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>
                        <input type="checkbox" v-model="settings.autoTrack"> 自動追従 (Auto Track)
                    </label>
                </div>
            </div>

            <div class="actions">
                <button class="primary" @click="startMic" :disabled="state.isLoading">
                    <span v-if="state.isLoading">
                        {{ state.loadingStatus }}
                        <span v-if="state.loadingProgress > 0 && state.loadingProgress < 100">
                            ({{ Math.floor(state.loadingProgress) }}%)
                        </span>
                    </span>
                    <span v-else>マイクで開始</span>
                </button>
                <button class="secondary" @click="startDemo" :disabled="state.isLoading">
                    <span v-if="state.isLoading">
                        {{ state.loadingStatus }}
                        <span v-if="state.loadingProgress > 0 && state.loadingProgress < 100">
                            ({{ Math.floor(state.loadingProgress) }}%)
                        </span>
                    </span>
                    <span v-else>デモモード開始</span>
                </button>
            </div>

            <div class="card system-settings"
                style="margin-top: 30px; border: 1px solid #444; background: transparent;">
                <h2 style="font-size: 16px; color: #888; border-bottom: 1px solid #444;">システム設定</h2>

                <div class="control-group">
                    <label>ボリューム (サイドトーン/デモ音)</label>
                    <input type="range" v-model.number="settings.volume" min="0" max="1" step="0.01">
                </div>

                <div class="control-group">
                    <label>モデル選択</label>
                    <select v-model="settings.modelPath">
                        <option value="../cw_decoder_quantized.onnx">軽量 (INT8)</option>
                        <option value="../cw_decoder.onnx">標準 (FP32)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>最大同時デコード数</label>
                    <select v-model.number="settings.maxDecoders">
                        <option :value="1">1 (メインのみ)</option>
                        <option :value="2">2</option>
                        <option :value="4">4 (推奨)</option>
                        <option :value="8">8</option>
                    </select>
                </div>

                <div class="control-group">
                    <button class="secondary small" @click="clearCache" style="font-size: 14px; padding: 8px;">キャッシュ削除
                        (更新用)</button>
                </div>
            </div>

            <p v-if="errorMessage" class="error">{{ errorMessage }}</p>
        </div>

        <!-- Main Spectrogram Screen -->
        <div class="screen main-screen">
            <!-- Overlay Info -->
            <div class="overlay-info">
                <div class="status-bar">
                    <span class="freq-display">{{ Math.round(state.trackedFreq) }} Hz</span>
                    <span v-if="settings.maxDecoders > 1" class="decoder-status"
                        :class="{ throttled: state.decoderThrottled }">
                        {{ state.activeDecoders }}/{{ settings.maxDecoders }}
                        {{ state.decoderThrottled ? '⚠' : '▶' }}
                        ({{ state.decoderUtilization }})
                    </span>
                    <button class="icon-btn" @click="toggleSettings">⚙️</button>
                    <button class="icon-btn stop-btn" @click="stop">■</button>
                </div>
            </div>

            <!-- Wide-band Spectrogram -->
            <div class="waterfall-container">
                <canvas ref="waterfallCanvas" class="waterfall-canvas"></canvas>
                <canvas ref="waterfallOverlayCanvas" class="waterfall-overlay-canvas"></canvas>

                <!-- Markers Layer -->
                <div class="markers-container">
                    <div v-for="(peak, index) in mergedPeaks" :key="index" class="peak-marker"
                        :style="{ top: getPeakY(peak.f) + 'px' }" @click="selectPeak(peak.f)">
                        <div v-if="peak.slotText" class="peak-decoded-text">
                            {{ peak.slotText }}
                        </div>
                        <div class="peak-dot" :class="{ 'has-slot': peak.hasSlot }"></div>
                        <div class="peak-label">{{ getPeakSNR(peak.snr).toFixed(1) }} dB</div>
                    </div>
                </div>

                <div ref="textContainer" class="decoded-text-content" :style="decodedTextStyle">{{ state.decodedText }}
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered', reg))
                .catch(err => console.error('SW registration failed', err));
        }
    </script>
</body>

</html>
